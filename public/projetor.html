<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cientistas do Futuro</title>
  <!-- Fonte Retro Limpa e Muito Legivel -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      font-family: 'VT323', monospace; 
      letter-spacing: 1px;
    }
    body {
      background: #08031a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* CANVAS DA GALÁXIA ANIMADA NO FUNDO */
    #space-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      image-rendering: pixelated;
    }

    /* CAIXA RETRO SOBREPOSTA AO FUNDO */
    .retro-box {
      background: rgba(26, 12, 64, 0.92);
      border: 4px solid #38bdf8;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.3), 8px 8px 0px #000000;
      padding: 40px;
      max-width: 800px;
      width: 100%;
      text-align: center;
      border-radius: 8px;
      position: relative;
      z-index: 2;
    }

    h1 {
      color: #facc15;
      font-size: 3.8rem;
      margin: 0 0 20px 0;
      text-transform: uppercase;
      text-shadow: 3px 3px #000000;
    }

    h2 {
      color: #38bdf8;
      font-size: 2.2rem;
      text-shadow: 2px 2px #000;
      line-height: 1.4;
      margin: 10px 0;
    }

    /* QUADRO DE INFORMAÇÕES CENTRADO */
    .info-box {
      background: rgba(13, 6, 40, 0.85);
      border: 3px dashed #facc15;
      padding: 25px;
      margin: 30px 0;
    }

    .info-box p {
      margin: 8px 0;
      line-height: 1.5;
    }

    /* BOTÃO LIMPO COM NOME EXATO */
    .btn-pixel {
      background: #22c55e;
      color: #ffffff;
      border: 3px solid #ffffff;
      box-shadow: 5px 5px 0px #000000;
      padding: 16px 40px;
      font-size: 2.2rem;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.1s;
      text-transform: uppercase;
    }
    .btn-pixel:hover {
      background: #16a34a;
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px #000000;
    }
    .btn-pixel:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    .btn-yellow { background: #eab308; color: #000; }

    /* IMAGEM DA CIENTISTA */
    .cientista-img {
      width: 240px;
      height: 240px;
      object-fit: cover;
      border: 4px solid #38bdf8;
      box-shadow: 6px 6px 0px #000;
      margin: 15px 0;
    }

    /* MURAL DE SONHOS EM GRID */
    .mural-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 15px;
      margin-top: 20px;
      max-height: 350px;
      overflow-y: auto;
    }
    .card-sonho {
      background: #0d0628;
      border: 2px solid #38bdf8;
      padding: 15px;
      font-size: 1.3rem;
      line-height: 1.4;
      color: #fef08a;
      box-shadow: 4px 4px 0px #000;
      text-align: left;
    }

    /* PÓDIO VINTAGE */
    .podium-box {
      background: #0d0628;
      border: 2px solid #facc15;
      padding: 15px;
      margin: 10px 0;
      box-shadow: 4px 4px 0px #000;
      font-size: 1.6rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ELEMENTO VISUAL DO ESPAÇO RETRO ANIMADO -->
  <canvas id="space-canvas"></canvas>

  <div class="retro-box">

    <!-- TELA INICIAL DO PROJETOR -->
    <div id="p-tela-espera">
      <h1>Cientistas do Futuro</h1>
      
      <div class="info-box">
        <p style="font-size: 2.2rem; color: #38bdf8;">
          Jogadores conectados: <span id="contador-jogadores" style="color: #22c55e;"></span>
        </p>
        <p style="font-size: 1.6rem; color: #fef08a;">
          Aponte a câmera para o QR Code para entrar no jogo
        </p>
      </div>

      <button class="btn-pixel" onclick="iniciarJogo()">Iniciar Quiz</button>
    </div>

    <!-- TELA DE PERGUNTA NO TELÃO -->
    <div id="p-tela-pergunta" class="hidden">
      <h2 id="p-numero-pergunta">PERGUNTA 1/8</h2>
      <p id="p-texto-pergunta" style="font-size: 1.8rem; color: #fef08a; margin: 20px 0; line-height: 1.5;"></p>

      <div style="text-align: center;">
        <img id="p-img-cientista" class="cientista-img" src="" alt="Cientista">
        <p id="p-nome-cientista" style="font-size: 1.5rem; color: #f472b6; margin-top: 5px;"></p>
      </div>

      <div style="margin-top: 25px;">
        <button class="btn-pixel btn-yellow" onclick="revelarResposta()">Revelar Resposta</button>
        <button class="btn-pixel" onclick="proximaPergunta()">Próxima</button>
      </div>

      <div id="box-resposta-certa" class="hidden" style="margin-top: 20px; background: #14532d; border: 3px solid #22c55e; padding: 15px;">
        <p style="font-size: 1.6rem; color: #86efac; margin: 0;">
          CORRETA: <span id="p-resposta-correta"></span>
        </p>
      </div>
    </div>

    <!-- TELA FINAL: MURAL DE SONHOS E PÓDIO -->
    <div id="p-tela-final" class="hidden">
      <h1>Mural e Pódio Final</h1>

      <h2>Ranking dos Cientistas</h2>
      <div id="podio-container"></div>

      <h2 style="margin-top: 30px; color: #f472b6;">Mural do Futuro</h2>
      <div id="mural-container" class="mural-grid"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // --- LÓGICA DA GALÁXIA ESPACIAL COM PLANETAS E CONSTELAÇÕES ---
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 1. Campo de Estrelas 3D Retro
    const stars = [];
    const numStars = 200;
    for (let i = 0; i < numStars; i++) {
      stars.push({
        x: (Math.random() - 0.5) * canvas.width * 2,
        y: (Math.random() - 0.5) * canvas.height * 2,
        z: Math.random() * canvas.width,
        color: ['#ffffff', '#38bdf8', '#fef08a', '#f472b6', '#a855f7'][Math.floor(Math.random() * 5)]
      });
    }

    // 2. Constelações Pixel Art (Pontos interligados por linhas)
    const constellations = [
      {
        z: 700,
        xOffset: -0.3,
        yOffset: -0.2,
        stars: [
          {x: 0, y: 0}, {x: 40, y: -20}, {x: 80, y: 10}, {x: 120, y: -10}, {x: 60, y: -50}
        ],
        lines: [[0,1], [1,2], [2,3], [1,4]]
      },
      {
        z: 900,
        xOffset: 0.25,
        yOffset: 0.2,
        stars: [
          {x: 0, y: 0}, {x: -30, y: 40}, {x: 20, y: 70}, {x: 50, y: 30}
        ],
        lines: [[0,1], [1,2], [2,3], [3,0]]
      }
    ];

    // 3. Planetas Coloridos Variados
    const celestialObjects = [
      { type: 'ringed', baseRadius: 28, color: '#38bdf8', ringColor: '#4ade80', z: 250, xOffset: -0.35, yOffset: 0.25 },
      { type: 'craters', baseRadius: 38, color: '#f97316', craterColor: '#c2410c', z: 550, xOffset: 0.38, yOffset: -0.2 },
      { type: 'striped', baseRadius: 48, color: '#e879f9', stripeColor: '#a855f7', z: 950, xOffset: -0.25, yOffset: -0.3 },
      { type: 'small', baseRadius: 16, color: '#34d399', z: 350, xOffset: 0.3, yOffset: 0.35 },
      { type: 'sun', baseRadius: 32, color: '#facc15', glowColor: '#f43f5e', z: 750, xOffset: -0.4, yOffset: -0.1 }
    ];

    function drawSpace() {
      // Fundo Espacial Noturno
      ctx.fillStyle = '#060214';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // --- Desenhar Estrelas de Fundo ---
      stars.forEach(star => {
        star.z -= 2.5;
        if (star.z <= 0) {
          star.z = canvas.width;
          star.x = (Math.random() - 0.5) * canvas.width * 2;
          star.y = (Math.random() - 0.5) * canvas.height * 2;
        }

        const k = 256 / star.z;
        const px = star.x * k + cx;
        const py = star.y * k + cy;

        if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
          const size = Math.max(1, Math.floor((1 - star.z / canvas.width) * 4));
          ctx.fillStyle = star.color;
          ctx.fillRect(Math.floor(px), Math.floor(py), size, size);
        }
      });

      // --- Desenhar Constelações ---
      constellations.forEach(c => {
        c.z -= 1.2;
        if (c.z <= 10) c.z = 1100;

        const scale = 300 / c.z;
        const baseX = cx + (canvas.width * c.xOffset) * scale;
        const baseY = cy + (canvas.height * c.yOffset) * scale;

        // Desenhar Linhas da Constelação
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
        ctx.lineWidth = Math.max(1, 2 * scale);
        c.lines.forEach(([i, j]) => {
          const p1 = { x: baseX + c.stars[i].x * scale, y: baseY + c.stars[i].y * scale };
          const p2 = { x: baseX + c.stars[j].x * scale, y: baseY + c.stars[j].y * scale };
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        });

        // Desenhar Estrelas da Constelação
        c.stars.forEach(s => {
          const sx = baseX + s.x * scale;
          const sy = baseY + s.y * scale;
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(Math.floor(sx - 2), Math.floor(sy - 2), Math.max(3, 5 * scale), Math.max(3, 5 * scale));
        });
      });

      // --- Desenhar Planetas ---
      celestialObjects.forEach(obj => {
        obj.z -= 1.2;
        if (obj.z <= 10) obj.z = 1200;

        const scale = 300 / obj.z;
        const px = cx + (canvas.width * obj.xOffset) * scale;
        const py = cy + (canvas.height * obj.yOffset) * scale;
        const radius = Math.max(4, obj.baseRadius * scale);

        if (px + radius > 0 && px - radius < canvas.width && py + radius > 0 && py - radius < canvas.height) {
          ctx.save();
          ctx.translate(px, py);

          if (obj.type === 'ringed') {
            ctx.fillStyle = obj.color;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = obj.ringColor;
            ctx.lineWidth = Math.max(2, radius * 0.15);
            ctx.beginPath();
            ctx.ellipse(0, 0, radius * 1.7, radius * 0.45, Math.PI / 6, 0, Math.PI * 2);
            ctx.stroke();

          } else if (obj.type === 'craters') {
            ctx.fillStyle = obj.color;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = obj.craterColor;
            ctx.beginPath();
            ctx.arc(-radius * 0.3, -radius * 0.2, radius * 0.25, 0, Math.PI * 2);
            ctx.arc(radius * 0.2, radius * 0.3, radius * 0.2, 0, Math.PI * 2);
            ctx.fill();

          } else if (obj.type === 'striped') {
            ctx.fillStyle = obj.color;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = obj.stripeColor;
            ctx.fillRect(-radius * 0.8, -radius * 0.3, radius * 1.6, radius * 0.25);
            ctx.fillRect(-radius * 0.9, radius * 0.1, radius * 1.8, radius * 0.2);

          } else if (obj.type === 'sun') {
            ctx.fillStyle = obj.glowColor;
            ctx.beginPath();
            ctx.arc(0, 0, radius * 1.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = obj.color;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

          } else {
            ctx.fillStyle = obj.color;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }
      });

      requestAnimationFrame(drawSpace);
    }

    drawSpace();

    // --- LÓGICA SOCKET.IO ---
    const socket = io();
    let perguntaAtual = 0;
    const totalPerguntas = 8;

    socket.on('atualizar_jogadores', (data) => {
      let total = (typeof data === 'object' && data !== null) 
        ? (data.qtd !== undefined ? data.qtd : (data.total || Object.keys(data).length)) 
        : data;

      const elementoContador = document.getElementById('contador-jogadores');
      
      if (total && total > 0) {
        elementoContador.innerText = total;
      } else {
        elementoContador.innerText = "";
      }
    });

    function iniciarJogo() {
      perguntaAtual = 1;
      carregarPergunta(perguntaAtual);
      document.getElementById('p-tela-espera').classList.add('hidden');
      document.getElementById('p-tela-pergunta').classList.remove('hidden');
    }

    function carregarPergunta(num) {
      document.getElementById('box-resposta-certa').classList.add('hidden');
      socket.emit('solicitar_pergunta', num);
    }

    socket.on('dados_pergunta', (dados) => {
      document.getElementById('p-numero-pergunta').innerText = `PERGUNTA ${dados.numero}/${totalPerguntas}`;
      document.getElementById('p-texto-pergunta').innerText = dados.pergunta;
      document.getElementById('p-img-cientista').src = dados.imagem;
      document.getElementById('p-nome-cientista').innerText = `Cientista: ${dados.cientista}`;
      document.getElementById('p-resposta-correta').innerText = `${dados.correta}) ${dados.opcoes[dados.correta]}`;
    });

    function revelarResposta() {
      document.getElementById('box-resposta-certa').classList.remove('hidden');
    }

    function proximaPergunta() {
      if (perguntaAtual < totalPerguntas) {
        perguntaAtual++;
        carregarPergunta(perguntaAtual);
      } else {
        socket.emit('encerrar_quiz');
        document.getElementById('p-tela-pergunta').classList.add('hidden');
        document.getElementById('p-tela-final').classList.remove('hidden');
      }
    }

    socket.on('mural_atualizado', (sonhos) => {
      const container = document.getElementById('mural-container');
      container.innerHTML = "";
      sonhos.forEach(s => {
        const card = document.createElement('div');
        card.className = 'card-sonho';
        card.innerHTML = `<strong>${s.nome}:</strong><br>"${s.sonho}"`;
        container.appendChild(card);
      });
    });

    socket.on('podio_final', (podio) => {
      const container = document.getElementById('podio-container');
      container.innerHTML = "";
      podio.forEach((p, idx) => {
        const box = document.createElement('div');
        box.className = 'podium-box';
        const medalha = idx === 0 ? "1º" : idx === 1 ? "2º" : "3º";
        box.innerHTML = `<span style="color: #facc15;">${medalha}</span> - ${p.nome} (${p.pontos} pts)`;
        container.appendChild(box);
      });
    });
  </script>
</body>
</html>
